<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 起動時のゲート画面(非対応ブラウザ / プロフィール登録 / フォルダ接続) -->
<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▦</span>
      <span id="projectName">Ticket Board</span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="topbar-right">
      <button id="btnCreate" class="btn primary">＋ チケット作成</button>
      <button id="btnSync" class="btn ghost" title="今すぐ再読み込み">↻ <span id="syncTime">--:--</span></button>
      <span id="meChip" class="me-chip"></span>
    </div>
  </header>
  <div id="filters" class="filters"></div>
  <main id="main"></main>
</div>

<dialog id="dlg" class="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
