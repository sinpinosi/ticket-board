<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Board</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c66e4'/%3E%3Crect x='6' y='6' width='5' height='20' rx='1.5' fill='white'/%3E%3Crect x='13.5' y='6' width='5' height='13' rx='1.5' fill='white'/%3E%3Crect x='21' y='6' width='5' height='17' rx='1.5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 起動時のゲート画面(非対応ブラウザ / プロフィール登録 / フォルダ接続) -->
<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▦</span>
      <span id="projectName">Ticket Board</span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="topbar-right">
      <button id="btnUnread" class="btn unread-btn" title="自分に関係するチケットの新着を表示" hidden></button>
      <button id="btnCreate" class="btn primary">＋ チケット作成</button>
      <button id="btnSync" class="btn ghost" title="今すぐ再読み込み">↻ <span id="syncTime">--:--</span></button>
      <span id="meChip" class="me-chip"></span>
    </div>
  </header>
  <div id="filters" class="filters"></div>
  <main id="main"></main>
</div>

<dialog id="dlg" class="dlg"></dialog>
<div id="toast" class="toast" popover="manual" hidden></div>

<script src="app.js"></script>
</body>
</html>
