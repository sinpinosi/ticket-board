<!-- 起動時のゲート画面(非対応ブラウザ / プロフィール登録 / フォルダ接続) -->
<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▦</span>
      <span id="projectName">Ticket Board</span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="topbar-right">
      <button id="btnUnread" class="btn unread-btn" title="自分に関係するチケットの新着を表示" hidden></button>
      <button id="btnCreate" class="btn primary">＋ チケット作成</button>
      <button id="btnSync" class="btn ghost" title="今すぐ再読み込み">↻ <span id="syncTime">--:--</span></button>
      <span id="meChip" class="me-chip"></span>
    </div>
  </header>
  <div id="filters" class="filters"></div>
  <main id="main"></main>
</div>

<dialog id="dlg" class="dlg"></dialog>
<div id="toast" class="toast" popover="manual" hidden></div>

<script src="app.js"></script>
